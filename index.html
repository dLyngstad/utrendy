<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTRENDY</title>
    <!-- Inkluderer Montserrat-fonten fra Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: transparent; /* Helt gjennomsiktig bakgrunn, bruker nettleserens standardhvite */
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        .utrendy-box {
            /* Stil for den brune boksen */
            background-color: #a67c52; /* En rik, varm brun farge */
            color: #fdf5e6; /* En lys, kremfarget nyanse for kontrast */
            padding: 40px 60px;
            border-radius: 12px; /* Myke, avrundede hjørner for stilisering */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); /* En myk, subtil skygge for dybde */
            border: 2px solid #8e653f; /* En litt mørkere brun border for definisjon */
            
            /* Stil for teksten inni boksen */
            font-size: 3rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
        }
    </style>
</head>
<body>
    <div class="utrendy-box">
        UTRENDY
    </div>
</body>
</html>
