<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161b;
    --bg-2: #191c22;
    --surface: #1f232b;
    --surface-hi: #262b34;
    --line: #313742;
    --text: #ecedf0;
    --muted: #8b93a1;
    --accent: #e8a13a;
    --accent-ink: #14161b;
    --radius: 14px;
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 90% at 50% -10%, #1c2028 0%, var(--bg) 60%);
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    -webkit-font-smoothing: antialiased;
  }

  .panel {
    width: 100%;
    max-width: 520px;
    background: linear-gradient(180deg, var(--bg-2), var(--bg));
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: clamp(1.75rem, 5vw, 3rem);
    box-shadow:
      0 1px 0 rgba(255,255,255,.03) inset,
      0 30px 70px -30px rgba(0,0,0,.7);
  }

  .eyebrow {
    font-size: .72rem;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: .7rem;
    margin: 0 0 1.4rem;
  }
  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }

  .display {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(6rem, 26vw, 11rem);
    line-height: .82;
    letter-spacing: -.03em;
    margin: 0;
    position: relative;
    width: max-content;
  }
  .display::after {
    content: "";
    position: absolute;
    left: .06em;
    bottom: .14em;
    width: .34em;
    height: .12em;
    border-radius: 2px;
    background: var(--accent);
  }

  .caption {
    color: var(--muted);
    font-size: .95rem;
    line-height: 1.5;
    margin: 1.2rem 0 2.2rem;
    max-width: 34ch;
  }

  /* Segmented selector */
  .selector {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    padding: 5px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  .pill {
    position: absolute;
    top: 5px;
    left: 5px;
    height: calc(100% - 10px);
    border-radius: 10px;
    background: var(--accent);
    box-shadow: 0 8px 20px -8px rgba(232,161,58,.7);
    transition: transform .42s var(--ease), width .42s var(--ease);
    z-index: 0;
    pointer-events: none;
  }

  .opt {
    position: relative;
    z-index: 1;
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 1.5rem;
    padding: 1.05rem 0;
    border-radius: 10px;
    cursor: pointer;
    transition: color .3s var(--ease), background .3s var(--ease);
  }
  .opt:hover { color: var(--text); background: var(--surface-hi); }
  .opt[aria-selected="true"] { color: var(--accent-ink); background: transparent; }
  .opt[aria-selected="true"]:hover { background: transparent; }
  .opt:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .readout {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-top: 1.6rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--line);
    font-size: .85rem;
    color: var(--muted);
  }
  .readout .label { letter-spacing: .18em; text-transform: uppercase; }
  .readout .value {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--text);
  }
  .readout .value b { color: var(--accent); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .pill { transition: none; }
  }
</style>
</head>
<body>
  <main class="panel">
    <p class="eyebrow">Selection</p>
    <h1 class="display">F</h1>
    <p class="caption">Choose an option below. The indicator tracks your current selection.</p>

    <div class="selector" role="tablist" aria-label="Options">
      <span class="pill" aria-hidden="true"></span>
      <button class="opt" role="tab" aria-selected="true">A</button>
      <button class="opt" role="tab" aria-selected="false">B</button>
      <button class="opt" role="tab" aria-selected="false">C</button>
      <button class="opt" role="tab" aria-selected="false">D</button>
    </div>

    <div class="readout">
      <span class="label">Active</span>
      <span class="value">Option <b id="current">A</b></span>
    </div>
  </main>

  <script>
    const opts = Array.from(document.querySelectorAll('.opt'));
    const pill = document.querySelector('.pill');
    const current = document.getElementById('current');

    function movePill(btn) {
      pill.style.width = btn.offsetWidth + 'px';
      pill.style.transform = 'translateX(' + (btn.offsetLeft - 5) + 'px)';
    }

    function select(btn) {
      opts.forEach(o => o.setAttribute('aria-selected', 'false'));
      btn.setAttribute('aria-selected', 'true');
      current.textContent = btn.textContent;
      movePill(btn);
    }

    opts.forEach((btn, i) => {
      btn.addEventListener('click', () => select(btn));
      btn.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          const dir = e.key === 'ArrowRight' ? 1 : -1;
          const next = opts[(i + dir + opts.length) % opts.length];
          next.focus();
          select(next);
        }
      });
    });

    // Position the pill once fonts/layout settle.
    window.addEventListener('load', () => movePill(opts[0]));
    window.addEventListener('resize', () => {
      const active = document.querySelector('.opt[aria-selected="true"]');
      movePill(active);
    });
  </script>
</body>
</html>
